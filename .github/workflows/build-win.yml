name: build-win

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall пересобирает нативные модули; без LL_SKIP_NATIVE_REBUILD, чтобы падало громко
      - run: npm ci
      - run: npx electron-builder install-app-deps
      - run: npm run typecheck
      - run: npm test
      - name: Версия из тега
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npx electron-vite build
      - name: Сборка и публикация релиза (тег v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Сборка без публикации
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --publish never
      - name: Проверка упаковки better-sqlite3
        shell: pwsh
        run: |
          $d = 'release/win-unpacked/resources/app.asar.unpacked/node_modules/better-sqlite3'
          $ok = (Test-Path "$d/build/Release/better_sqlite3.node") -or (Test-Path "$d/prebuilds/win32-x64.node")
          if (-not $ok) { Write-Error "better_sqlite3.node не найден ни в build/Release, ни в prebuilds/win32-x64.node под $d"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: leadly-setup
          path: release/*.exe
          if-no-files-found: error
